method_filament_mixed: " Standard materials share one rate; specialty materials are charged at their own rate."
method_machine: "Machine time, electricity and printer wear are charged per hour of printing. They grow in a straight line with print time: a print twice as long costs twice as much machine time, never more."
method_risk: "Prints sometimes fail partway, and longer prints are more likely to. We estimate each plate's chance of printing right first time {source}, and include the expected cost of reprinting. That is the failure allowance.{free}"
